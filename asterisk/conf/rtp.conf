;
; rtp.conf — 음성(RTP) 포트 범위
;
; 통화 구간(채널) 하나가 RTP 포트 1개 + RTCP 포트 1개를 쓴다.
; Asterisk를 거치는 2자 통화는 구간이 2개라서 포트 4개 → 10000-10099면 동시에 약 25통화.
; docker-compose.yml에서 공개한 포트 범위와 반드시 같아야 한다.
; 안 맞으면 "가끔만 소리가 안 들림" 같은 재현하기 어려운 증상이 생긴다.
;
[general]
rtpstart = 10000
rtpend = 10099
; strictrtp = yes (기본값): 협상한 상대가 아닌 곳에서 온 RTP를 버린다 (RTP 주입 방지)
