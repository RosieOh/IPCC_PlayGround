;
; logger.conf — 로그를 어디에 어떤 레벨로 남길지
;
[general]
dateformat = %F %T.%3q        ; 2026-10-16 14:03:05.123
; queue_log는 기본으로 켜져 있다 → /var/log/asterisk/queue_log (Stage 4에서 통계 대조에 사용)

[logfiles]
; 컨테이너 표준출력 (make logs)
console => notice,warning,error,verbose
; 파일: Mac의 data/asterisk/log/ 에서 바로 열어볼 수 있다
messages.log => notice,warning,error,verbose
security.log => security
