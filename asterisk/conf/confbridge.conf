;
; confbridge.conf — 회의방(ConfBridge) 설정
;
; 룸 큐(docs/12-room-queue.md)가 쓴다: app_queue 대신 통화마다 회의방을 하나 열고,
; 고객은 방에서 대기음을 들으며 기다리다가 엔진이 부른 상담원이 들어오면 통화가 시작된다.
; 상담원을 둘 넣으면 그대로 3자통화이고, 한 명이 나가면 전환이 된다.
;
[general]

; 방 하나에 고객 1 + 상담원 최대 2(전환·3자통화) + 녹음 채널
[rq_bridge]
type = bridge
max_members = 5

; 고객: 상담원(marked)이 들어올 때까지 대기음을 듣고, 마지막 상담원이 나가면 같이 나간다
[rq_customer]
type = user
wait_marked = yes
end_marked = yes
music_on_hold_when_empty = yes
music_on_hold_class = default
quiet = yes
announce_user_count = no
announce_only_user = no

; 보류 방의 고객: 혼자 있으면 대기음. 상담원은 이 방에 오지 않는다
[rq_hold]
type = user
music_on_hold_when_empty = yes
music_on_hold_class = default
quiet = yes
announce_user_count = no
announce_only_user = no

; 상담원: marked. 상담원이 하나라도 방에 있으면 고객은 남아 있는다
[rq_agent]
type = user
marked = yes
quiet = yes
announce_user_count = no
announce_only_user = no
