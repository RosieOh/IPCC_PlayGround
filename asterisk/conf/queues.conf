;
; queues.conf — 큐(대기열). ACD(자동 호 분배)를 Asterisk app_queue로 한다.
;
; 상담원(멤버)은 여기에 적지 않는다. CTI 엔진이 상담원 로그인 때 AMI QueueAdd로 넣고,
; 로그아웃 때 QueueRemove로 뺀다. 이석·후처리는 QueuePause로 반영한다. (docs/06-state-model.md)
;
[general]
persistentmembers = no        ; 재시작하면 멤버를 잊는다 — 로그인 상태의 기준은 엔진이다
autofill = yes                ; 대기 고객 여러 명을 여러 상담원에게 동시에 분배
shared_lastcall = yes
log_membername_as_agent = yes ; queue_log에 인터페이스 대신 MemberName을 기록

[support]
strategy = rrmemory           ; 라운드로빈(마지막으로 받은 상담원 다음부터)
timeout = 15                  ; 상담원 1명에게 벨을 울리는 시간(초)
retry = 2                     ; 무응답 뒤 다음 시도까지 쉬는 시간(초)
wrapuptime = 0                ; 후처리(ACW)는 Asterisk가 아니라 엔진이 QueuePause로 관리한다
autopause = no                ; '무응답 시 자동 이석'도 엔진 정책으로 (Asterisk가 멋대로 pause하지 않게)
ringinuse = no                ; 통화 중인 상담원에게는 벨을 울리지 않는다
joinempty = yes               ; 로그인한 상담원이 없어도 대기열에 들어간다
leavewhenempty = no
servicelevel = 20             ; 서비스레벨 기준(초). QueueParams 이벤트의 ServicelevelPerf 계산에 쓰인다
musicclass = default
announce-frequency = 30       ; 30초마다 대기 안내
announce-holdtime = no
setinterfacevar = yes         ; 연결된 상담원 정보를 채널 변수(MEMBERINTERFACE 등)로 남긴다
setqueueentryvar = yes        ; 큐 대기 정보를 채널 변수(QEHOLDTIME 등)로 남긴다
