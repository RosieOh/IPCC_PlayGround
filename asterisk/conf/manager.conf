;
; manager.conf — AMI(Asterisk Manager Interface)
;
; AMI는 TCP 5038의 텍스트 프로토콜이다. CTI 엔진은 여기에 접속해서
; 이벤트를 받고(콜 상태 추적) 액션을 보낸다(전화 걸기, 큐 로그인 등).
; 자세한 내용: docs/05-ami.md
;
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0            ; 컨테이너 안에서는 모든 주소. 바깥 공개는 compose에서 127.0.0.1로만 한다
displayconnects = yes         ; 접속/해제를 콘솔에 표시
timestampevents = yes         ; 모든 이벤트에 Timestamp 필드 추가 → 녹화 재생 때 시간 계산에 필요
webenabled = no               ; HTTP를 통한 AMI는 쓰지 않음

; CTI 엔진(amicli 포함)이 쓰는 계정
[ipcc]
secret = ipcc-secret
; 접속 허용 대역. Docker Desktop은 Mac → 컨테이너 접속의 출발지를 내부 사설 IP로 바꾼다.
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
; 학습용이라 전부 허용. 운영에서는 필요한 권한만 준다 (예: read=call,agent,reporting / write=originate,call,agent)
read = all
write = all
; 너무 시끄러운 이벤트는 서버 쪽에서 거른다 (!로 시작하면 '제외').
;  - VarSet: 다이얼플랜 변수 하나가 바뀔 때마다 발생
;  - RTCPSent/RTCPReceived: 통화마다 몇 초 간격으로 발생
eventfilter = !Event: VarSet
eventfilter = !Event: RTCP(Sent|Received)
; writetimeout = 100          ; 기본값(ms). 클라이언트가 제때 읽지 않아 쓰기가 막히면 이벤트 유실·세션 종료로 이어질 수 있다
