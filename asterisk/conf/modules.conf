;
; modules.conf — 어떤 모듈을 올릴지
;
; autoload=yes: 설치된 모듈을 전부 올린다. 설정 파일이 없는 모듈은 스스로 로드를 거절(decline)하면서
; ERROR 로그를 남긴다. 쓰지 않는 모듈은 noload로 빼서 시작 로그에 ERROR가 하나도 없게 유지한다.
; (평소 로그가 깨끗해야 진짜 문제가 눈에 띈다)
;
[modules]
autoload = yes

;----------------------------------------------------------------------
; 나중 Stage에서 쓸 모듈 — 그때 이 줄을 지우고 설정 파일을 추가한다
;----------------------------------------------------------------------
; Stage 4: CDR·queue_log를 MySQL로 (res_odbc.conf, cdr_adaptive_odbc.conf 필요)
noload => res_odbc.so
noload => res_odbc_transaction.so
noload => res_config_odbc.so
noload => cdr_odbc.so
noload => cdr_adaptive_odbc.so
noload => cel_odbc.so
noload => func_odbc.so
; 페이징 (app_confbridge를 쓴다. 룸 큐에서는 쓰지 않는다)
noload => app_page.so
; 콜 파킹 (res_parking.conf 필요)
noload => res_parking.so
; 아웃바운드 캠페인: 자동응답기 감지 (amd.conf 필요)
noload => app_amd.so
; Stage 6: 메트릭 (prometheus.conf 필요)
noload => res_prometheus.so

;----------------------------------------------------------------------
; 쓰지 않는 모듈
;----------------------------------------------------------------------
noload => res_clialiases.so
noload => res_http_media_cache.so

; SIP는 PJSIP(chan_pjsip)만 쓴다
noload => chan_iax2.so
noload => chan_unistim.so

; 패킷 복제(HEP), 단말 프로비저닝, NOTIFY 템플릿 — 쓰지 않는다
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_pjsip_notify.so
noload => res_pjsip_config_wizard.so

; 음성사서함, ADSI 단말 — 쓰지 않는다
noload => app_voicemail.so
noload => app_minivm.so
noload => app_adsiprog.so
noload => app_getcpeid.so
noload => res_adsi.so

; Asterisk 내장 상담원 기능 — 이 프로젝트는 상담원 상태를 CTI 엔진이 관리한다
noload => app_agent_pool.so

; 그 밖에 쓰지 않는 기능
noload => res_config_sqlite3.so
noload => res_aeap.so
noload => res_speech_aeap.so
noload => res_smdi.so
noload => res_stun_monitor.so
noload => res_calendar.so
noload => app_festival.so
noload => app_alarmreceiver.so
noload => app_followme.so
noload => pbx_ael.so
noload => cdr_custom.so
noload => cel_custom.so
noload => cdr_sqlite3_custom.so
noload => cel_sqlite3_custom.so
