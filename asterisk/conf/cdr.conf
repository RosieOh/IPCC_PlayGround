;
; cdr.conf — CDR(Call Detail Record): 통화 구간별 과금형 기록
;
; CDR은 '구간' 단위라서 콜센터 통계(대기시간, 포기호 등)를 그대로 뽑기에는 부족하다.
; Stage 4에서 엔진이 만든 이력, queue_log와 숫자를 맞춰 보는 용도로 켜 둔다.
; 파일: data/asterisk/log/cdr-csv/Master.csv
;
[general]
enable = yes
unanswered = yes              ; 응답되지 않은 구간도 기록
congestion = yes

[csv]
usegmtime = no
loguniqueid = yes             ; Uniqueid를 남겨 엔진 이력과 조인할 수 있게
loguserfield = yes
