;
; features.conf — 통화 중 DTMF 키로 쓰는 기능 (호전환 등)
;
; 호전환은 세 가지 경로로 일어날 수 있고, 경로마다 AMI 이벤트가 조금씩 다르다 (Stage 2에서 비교).
;   1) 소프트폰의 '전환' 버튼   → SIP REFER          (이 파일과 무관)
;   2) 통화 중 DTMF 키          → 아래 featuremap     (Dial/Queue에 t, T 옵션이 있어야 동작)
;   3) CTI 엔진의 AMI 액션      → BlindTransfer, Atxfer
;
[general]
transferdigittimeout = 3      ; 전환할 번호를 누르는 동안 기다리는 시간(초)

[featuremap]
blindxfer => ##               ; 블라인드 전환: ## 누르고 번호
atxfer => *2                  ; 어텐디드 전환: *2 누르고 번호 → 상대와 먼저 통화한 뒤 넘김
disconnect => *0
