;
; extensions.conf — 다이얼플랜: "이 번호로 오면 무엇을 할지"
;
; 문법:  exten => 번호,순서,애플리케이션(인자)
;        same  => n,...      같은 번호의 다음 순서
;        _100X 처럼 _로 시작하면 패턴 (X=0~9, Z=1~9, N=2~9, .=한 글자 이상 아무거나)
; 고친 뒤에는 `make reload` (또는 CLI에서 dialplan reload)
;
[general]
static = yes
writeprotect = yes            ; CLI의 'dialplan save'가 이 파일을 덮어쓰지 못하게

[globals]
SUPPORT_QUEUE = support

;======================================================================
; [internal] — 내선(소프트폰)이 거는 번호
;======================================================================
[internal]
; 내선끼리 통화: 1001 → 1002  (tT: 양쪽 모두 DTMF로 호전환 가능 — features.conf)
exten => _100X,1,NoOp(내선 통화 ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

; 5000 — 상담 대표번호. 내선에서 걸면 '고객'처럼 큐로 들어간다.
exten => 5000,1,Goto(inbound,s,1)

; 5100 — 룸 큐 대표번호 (app_queue 없이 엔진이 상담원을 고르는 큐, docs/12)
exten => 5100,1,Goto(rq-in,s,1)

; 600 — 에코 테스트: 내 목소리가 되돌아온다 (양방향 음성 확인)
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 601 — 안내멘트: Asterisk → 나 방향 음성 확인
exten => 601,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; 602 — 안내멘트 없이 바로 에코. 음성(RTP) 경로 자동 검사(make rtp-check)가 쓴다
exten => 602,1,Answer()
 same => n,Echo()
 same => n,Hangup()

;======================================================================
; [inbound] — 고객 인입(대표번호) → 큐
;   실제 센터라면 통신사 회선(trunk)으로 들어온 콜이 여기로 온다.
;======================================================================
[inbound]
exten => s,1,NoOp(고객 인입 ${CALLERID(all)})
 same => n,Answer()
 same => n,Playback(hello-world)                 ; 인사 멘트 자리 (Stage 5에서 ARS로 교체)
 same => n,Queue(${SUPPORT_QUEUE},t,,,120)       ; t: 상담원이 호전환 가능 / 120초 기다리면 타임아웃
 same => n,NoOp(큐 종료 QUEUESTATUS=${QUEUESTATUS})
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

;======================================================================
; 시뮬레이션 — 소프트폰 없이 AMI로 콜을 만든다 (amicli sim-call, amicli agent -sim)
;======================================================================
; 가짜 고객: Originate Channel=Local/customer@sim → 대표번호로 인입
[sim]
exten => customer,1,NoOp(SIM 고객 ${CALLERID(num)})
 same => n,Goto(inbound,s,1)

; 가짜 고객(짧은 대기): 큐에서 8초만 기다리고 타임아웃된다 → 큐 타임아웃 시나리오
exten => customer-short,1,NoOp(SIM 고객(짧은 대기) ${CALLERID(num)})
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Queue(${SUPPORT_QUEUE},t,,,8)
 same => n,NoOp(큐 종료 QUEUESTATUS=${QUEUESTATUS})
 same => n,Hangup()

; 가짜 고객 → 룸 큐 (bin/rqengine, make sim-rq-call)
exten => rq-customer,1,NoOp(SIM 룸 큐 고객 ${CALLERID(num)})
 same => n,Goto(rq-in,s,1)

; 받지 않는 가짜 상담원: 벨만 울리고 끝내 받지 않는다 → 무응답 재분배 시나리오
[sim-noanswer]
exten => _X.,1,NoOp(SIM 상담원 ${EXTEN} 무응답)
 same => n,Ringing()
 same => n,Wait(60)
 same => n,Hangup()

; 호전환 목적지: 상담원이 고객을 다른 가짜 상담원에게 넘길 때 AMI BlindTransfer/Atxfer의 Context로 쓴다
[transfer]
exten => _X.,1,NoOp(호전환 → ${EXTEN})
 same => n,Dial(Local/${EXTEN}@sim-agent,30)
 same => n,Hangup()

; 가짜 상담원 단말: 큐 멤버 인터페이스를 Local/<내선>@sim-agent 로 등록하면
; 벨이 SIM_RING초(기본 2초) 울린 뒤 받고, SIM_TALK초(기본 5~15초 랜덤) 통화하다 끊는다.
[sim-agent]
exten => _X.,1,NoOp(SIM 상담원 ${EXTEN} 벨울림)
 same => n,Set(RING=${IF($["${SIM_RING}" = ""]?2:${SIM_RING})})
 same => n,Set(TALK=${IF($["${SIM_TALK}" = ""]?${RAND(5,15)}:${SIM_TALK})})
 same => n,Ringing()
 same => n,Wait(${RING})
 same => n,Answer()
 same => n,NoOp(SIM 상담원 ${EXTEN} 통화 ${TALK}초)
 same => n,Wait(${TALK})
 same => n,Hangup()

;======================================================================
; 룸 큐 — app_queue 없이 직접 만든 큐 (docs/12-room-queue.md)
;
;   고객은 통화마다 생기는 회의방(rq-<Linkedid>)에서 대기음을 들으며 기다린다.
;   상담원을 고르는 것은 엔진(bin/rqengine)이고, 엔진이 AMI Originate로 상담원을 같은 방에 부른다.
;   dialplan은 상태를 저장하지 않고 UserEvent로 일어난 일만 알린다 → 상태의 주인은 엔진 하나다.
;
;   UserEvent: RQEnter(고객이 방에 들어옴) RQAgentIn(상담원이 방에 들어옴) RQAgentMissed(들어갈 방이 없음)
;              RQAgentOut(상담원 채널 끊김) RQCustomerOut(고객 채널 끊김)
;======================================================================
[rq-in]
exten => s,1,NoOp(룸 큐 인입 ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(RQ_ROOM=rq-${CHANNEL(linkedid)})
 same => n,Set(CHANNEL(hangup_handler_push)=rq-hangup,customer,1)
 same => n,UserEvent(RQEnter,Room: ${RQ_ROOM},Queue: support,Customer: ${CALLERID(num)})
 same => n,ConfBridge(${RQ_ROOM},rq_bridge,rq_customer)
 same => n,Hangup()

; 엔진의 Originate가 상담원 채널을 여기로 보낸다 (상담원이 받은 뒤). 변수 RQ_ROOM, RQ_AGENT는 엔진이 넣는다
[rq-agent]
exten => s,1,NoOp(룸 큐 상담원 ${RQ_AGENT} → ${RQ_ROOM})
 same => n,Set(CHANNEL(hangup_handler_push)=rq-hangup,agent,1)
 ; 벨이 울리는 사이 고객이 끊었으면 빈 방에 들어가지 않는다
 same => n,GotoIf($[0${CONFBRIDGE_INFO(parties,${RQ_ROOM})} = 0]?gone)
 same => n,UserEvent(RQAgentIn,Room: ${RQ_ROOM},Agent: ${RQ_AGENT})
 same => n,ConfBridge(${RQ_ROOM},rq_bridge,rq_agent)
 same => n,Hangup()
 same => n(gone),UserEvent(RQAgentMissed,Room: ${RQ_ROOM},Agent: ${RQ_AGENT},Why: customer-gone)
 same => n,Hangup()

; 끊김 처리기: 채널이 어떤 이유로 끊기든(고객 포기, 상담원 종료, 엔진의 Hangup) 마지막에 한 번 알린다
[rq-hangup]
exten => customer,1,UserEvent(RQCustomerOut,Room: ${RQ_ROOM},Cause: ${HANGUPCAUSE})
 same => n,Return()
exten => agent,1,UserEvent(RQAgentOut,Room: ${RQ_ROOM},Agent: ${RQ_AGENT},Cause: ${HANGUPCAUSE})
 same => n,Return()
