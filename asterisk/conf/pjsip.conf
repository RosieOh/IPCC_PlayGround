;
; pjsip.conf — SIP 설정 (chan_pjsip)
;
; ※ 블로그에 흔한 sip.conf(chan_sip)는 Asterisk 21부터 삭제됐다. 이 프로젝트는 PJSIP만 쓴다.
;
; PJSIP는 역할별 객체를 조합한다.
;   transport  어떤 프로토콜/포트로 SIP를 주고받을지 (UDP 5060)
;   endpoint   단말 하나의 통화 설정 (코덱, 다이얼플랜 context, NAT 옵션)
;   aor        이 단말에 전화를 걸 때 어디로 보낼지 (REGISTER로 등록된 주소)
;   auth       인증 정보 (사용자/비밀번호)
; 같은 이름([1001])을 type만 다르게 여러 번 써도 된다.
;
; transport는 컨테이너 시작 때 entrypoint.sh가 pjsip_transport.conf.tmpl에
; EXTERNAL_IP를 넣어 만든 파일을 읽는다 (NAT 설정이 실행 환경마다 다르기 때문).
#include /etc/asterisk-generated/pjsip_transport.conf

[global]
type = global
user_agent = IPCC-Playground

;----------------------------------------------------------------------
; 템플릿 — (!)는 '템플릿'이라는 뜻이고 [이름](템플릿)으로 상속한다
;----------------------------------------------------------------------
[agent-endpoint](!)
type = endpoint
transport = transport-udp
context = internal            ; 이 단말이 건 번호는 extensions.conf의 [internal]에서 처리
disallow = all
allow = ulaw,alaw             ; G.711. 대부분의 소프트폰과 WebRTC 브라우저가 지원
direct_media = no             ; 음성이 항상 Asterisk를 거치게 한다 (녹취·감청·NAT 대응에 필요)
rtp_symmetric = yes           ; 받은 RTP의 출발지로 되돌려 보낸다 (NAT 뒤 단말 대응)
force_rport = yes             ; SIP 응답을 실제 출발지 포트로 보낸다 (RFC 3581)
rewrite_contact = yes         ; 등록 주소를 패킷의 실제 출발지로 바꿔 기록한다
dtmf_mode = rfc4733           ; DTMF를 RTP 이벤트로 보낸다 (ARS 번호 입력)
device_state_busy_at = 1      ; 통화 1개면 BUSY → 큐가 통화 중인 상담원을 건너뛴다
language = en

[agent-aor](!)
type = aor
max_contacts = 1
remove_existing = yes         ; 새로 등록하면 이전 등록을 지운다
qualify_frequency = 30        ; 30초마다 OPTIONS로 살아있는지 확인 (NAT 매핑 유지 효과도 있음)

[agent-auth](!)
type = auth
auth_type = userpass

;----------------------------------------------------------------------
; 상담원 내선 1001~1003 — 소프트폰에서 이 계정으로 등록한다
;----------------------------------------------------------------------
[1001](agent-endpoint)
auth = 1001
aors = 1001
callerid = "상담원 1001" <1001>

[1001](agent-auth)
username = 1001
password = ipcc1001

[1001](agent-aor)

[1002](agent-endpoint)
auth = 1002
aors = 1002
callerid = "상담원 1002" <1002>

[1002](agent-auth)
username = 1002
password = ipcc1002

[1002](agent-aor)

[1003](agent-endpoint)
auth = 1003
aors = 1003
callerid = "상담원 1003" <1003>

[1003](agent-auth)
username = 1003
password = ipcc1003

[1003](agent-aor)

;----------------------------------------------------------------------
; 9001 — 자동 테스트(SIPp) 전용
;   소프트폰 계정(1001~1003)과 등록이 겹치지 않게 분리했다.
;----------------------------------------------------------------------
[9001](agent-endpoint)
auth = 9001
aors = 9001
callerid = "SIPp" <9001>

[9001](agent-auth)
username = 9001
password = sipp9001

[9001](agent-aor)
